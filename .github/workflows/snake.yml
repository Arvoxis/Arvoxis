name: snake

on:
  schedule: [{cron: "0 */12 * * *"}]
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Arvoxis
          outputs: |
            dist/snake.svg?color_snake=#f0883e&color_dots=#eef2f0,#8ae89b,#3ccf5e,#1fa34a,#0f6b2f
            dist/snake-dark.svg?color_snake=#f0883e&color_dots=#161b22,#1d6b3f,#20964c,#2fd163,#5bf58a

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
